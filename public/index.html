    <style>

        .notif-done.clickable { cursor: pointer; transition: background 0.2s; }

        .pin-qr-row { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; margin: 4px 0; }
        .qr-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }

        .qr-hint { color: var(--text-light); font-size: 0.75rem; margin: 0; text-align: center; }
        #timerWrapper { text-align: center; margin-top: 6px; }
        @keyframes hint-appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .desktop-hint { display: none; margin-top: 14px; color: #4b5563; font-size: 0.88rem; line-height: 1.55; text-align: center; border-top: 1px dashed #e5e7eb; padding-top: 12px; }
        .desktop-hint.visible { animation: hint-appear 0.5s ease forwards; }
        @media (min-width: 768px) { .desktop-hint { display: block; } }
        .viral-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--text-light); font-size: 0.82rem; padding: 6px 14px; border-radius: 20px; border: 1px dashed #d1d5db; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; user-select: none; margin-top: 10px; }

<div class="container">
    <!-- Send -->
    <div class="card">
        <h2 data-i18n="sendTitle">Отправить</h2>
        <input type="text" id="urlInput" data-i18n-ph="urlPlaceholder" placeholder="Ссылка или текст…">
        <button id="pasteBtn" class="secondary" onclick="pasteFromClipboard()" data-i18n="pasteBtn" disabled>Вставить из буфера</button>
        <button onclick="sendLink()" id="sendBtn" data-i18n="sendBtn">Сгенерировать код</button>
        <div id="sendError" class="error"></div>

        <div id="sendResult" style="display:none; text-align: center;">
            <p id="yourCodeLabel" style="margin-bottom: 4px;" data-i18n="yourCode">Ваш код:</p>

            <div class="pin-qr-row">
                <!-- PIN -->
                <div>
                    <div class="pin-display" id="generatedPin" onclick="copyPin()" data-i18n-title="clickToCopy"></div>
                    <p id="clickToCopyHint" style="color: var(--text-light); font-size: 0.85rem; margin: 0;" data-i18n="clickToCopy">Нажмите на код, чтобы скопировать</p>

                <!-- QR -->
                <div class="qr-box" id="qrWrapper" style="display:none;">

            <!-- Виральная строка: подсказка куда идти получателю кода -->

    <!-- Receive -->
    <div class="card">
        <h2 data-i18n="receiveTitle">Получить ссылку</h2>
        <input type="text" id="pinInput" class="pin-input" placeholder="_ _ _ _" maxlength="5" readonly>

        <div class="keypad">
            <button onclick="typePin(1)">1</button>
            <button onclick="typePin(2)">2</button>
            <button onclick="typePin(3)">3</button>
            <button onclick="typePin(4)">4</button>
            <button onclick="typePin(5)">5</button>
            <button onclick="typePin(6)">6</button>
            <button onclick="typePin(7)">7</button>
            <button onclick="typePin(8)">8</button>
            <button onclick="typePin(9)">9</button>
            <button onclick="clearPin()">C</button>
            <button onclick="typePin(0)">0</button>
            <button class="backspace" onclick="deleteLastPin()">⌫</button>
        </div>

        <p id="desktopHint" class="desktop-hint"></p>
        <div id="receiveError" class="error"></div>

        <div id="successArea" class="success-link">
            <p style="margin-top:0;" id="receivedLabel"></p>
            <a id="receivedLink" href="#" target="_blank" style="color: var(--primary); display:none; word-break:break-all;"></a>
            <p id="receivedText" style="margin:0; white-space:pre-wrap; word-break:break-all; display:none;"></p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="openBtn" onclick="openReceivedContent()" data-i18n="openBtn">Открыть</button>
                <button id="copyBtn" class="secondary" onclick="copyReceivedContent()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span class="btn-label" data-i18n="copyBtn">Скопировать</span>

<script>
    // ── Локализация ───────────────────────────────────────────────────────────
    const langs = navigator.languages?.length ? navigator.languages : [navigator.language || 'en'];
    const lang = langs.some(l => l.toLowerCase().startsWith('ru')) ? 'ru' : 'en';
    document.documentElement.lang = lang;

    const TRANSLATIONS = {
        ru: {
            sendTitle:      'Отправить ссылку',
            urlPlaceholder: 'Ссылка или текст…',
            pasteBtn:       'Вставить из буфера',
            sendBtn:        'Сгенерировать код',
            sendBtnLoading: 'Загрузка…',
            yourCode:       'Ваш код:',
            clickToCopy:    'Нажмите на код, чтобы скопировать',
            qrHint:         'Сканируй камерой для открытия',
            orLabel:        'или:',
            receiveTitle:   'Получить по коду',
            openBtn:        'Открыть',
            copyBtn:        'Скопировать',
            footer:         'Ссылки временные и автоматически удаляются через 10 минут.',
            errorEmpty:     'Введите ссылку или текст',
            clipboardDenied:'Нет доступа к буферу обмена. Вставьте ссылку вручную.',
            copyFailed:     'Не удалось скопировать',
            timerRunning:   (m, s) => `Ссылка удалится через ${m}:${s}`,
            timerExpired:   'Ссылка удалена',
            timerDeleteHint:'Нажмите, чтобы удалить ссылку',
            deleteConfirm:  'Удалить ссылку? Никто больше не сможет её получить.',
            deleteFailed:   'Не удалось удалить: ',
            labelLink:      '<b>Ссылка получена:</b>',
            labelText:      '<b>Текст получен:</b>',
            copied:         'Скопировано!',
            linkOpened:     (time) => `Ссылка получена! ${time}`,
            linkOpenedHint: 'Нажмите, чтобы удалить ссылку с сервера',
            desktopHint:    'На другом устройстве откройте 1qaz.su и введите код — ссылка откроется мгновенно.',
            viralChip:      (host, pin) => `Открой ${host} → введи код ${pin}`,
            viralMsg:       (host, pin) => `Открой ${host} и введи код: ${pin}`,
            viralCopied:    'Скопировано!',
        },
        en: {
            sendTitle:      'Send a link',
            urlPlaceholder: 'Link or text…',
            pasteBtn:       'Paste from clipboard',
            sendBtn:        'Generate code',
            sendBtnLoading: 'Loading…',
            yourCode:       'Your code:',
            clickToCopy:    'Click the code to copy',
            qrHint:         'Scan with camera to open',
            orLabel:        'or:',
            receiveTitle:   'Receive by code',
            openBtn:        'Open',
            copyBtn:        'Copy',
            footer:         'Links are temporary and automatically deleted after 10 minutes.',
            errorEmpty:     'Enter a link or text',
            clipboardDenied:'Clipboard access denied. Please paste manually.',
            copyFailed:     'Could not copy',
            timerRunning:   (m, s) => `Expires in ${m}:${s}`,
            timerExpired:   'Link deleted',
            timerDeleteHint:'Click to delete link',
            deleteConfirm:  'Delete the link? No one will be able to retrieve it.',
            deleteFailed:   'Could not delete: ',
            labelLink:      '<b>Link received:</b>',
            labelText:      '<b>Text received:</b>',
            copied:         'Copied!',
            linkOpened:     (time) => `Link received! ${time}`,
            linkOpenedHint: 'Click to delete link from server',
            desktopHint:    'On another device, open 1qaz.su and enter this code — the link will open instantly.',
            viralChip:      (host, pin) => `Open ${host} → enter code ${pin}`,
            viralMsg:       (host, pin) => `Go to ${host} and enter code: ${pin}`,
            viralCopied:    'Copied!',
        }
    };
    const t = TRANSLATIONS[lang];

    // Применяем переводы к статичным элементам
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n] ?? el.textContent;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        el.placeholder = t[el.dataset.i18nPh] ?? el.placeholder;
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t[el.dataset.i18nTitle] ?? el.title;
    });

    // ── PWA: Service Worker ───────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.update());
        });
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // ── PWA: Share Target — подхватываем URL из Android "Поделиться" ─────────
    (function handleShareTarget() {
        const p = new URLSearchParams(window.location.search);
        const shared = (p.get('url') || p.get('text') || p.get('title') || '').trim();
        if (shared) {
            document.getElementById('urlInput').value = shared;
            history.replaceState({}, '', '/'); // убираем параметры из адресной строки
        } else {
            document.getElementById('urlInput').focus();
        }
    })();

    // ── Состояние ─────────────────────────────────────────────────────────────
    const sessionId = Math.random().toString(36).substring(2, 15);
    let receivedContent = '';
    let currentPin = null;
    let activeUrl = null;
    let countdownEnd = null;
    let countdownInterval = null;
    let currentPinLength = 4;

    function isUrl(str) {
        return /^[a-z][a-z0-9+\-.]*:\/\//i.test(str);
    }

    fetch('/api/config')
        .then(r => r.json())
        .then(d => { currentPinLength = d.pinLength; })
        .catch(() => {});

    // ── Polling: проверяем открыта ли ссылка ─────────────────────────────────
    let pollInterval = null;
    function startPolling(pin) {
        stopPolling();
        pollInterval = setInterval(async () => {
            try {
                const r = await fetch(`/api/status/${pin}?sessionId=${sessionId}`);
                const d = await r.json();
                if (d.status === 'opened') {
                    document.getElementById('notificationArea').innerHTML =
                        `<span class="notif-done clickable" title="${t.linkOpenedHint}" onclick="deleteCurrentLink()"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="10" fill="#10b981"/><path d="M5.5 10.5l3 3 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>${t.linkOpened(d.openedAt || '')}</span>`;
                    stopPolling();
                } else if (d.status === 'expired' || d.status === 'unknown') {
                    stopPolling();
                }
            } catch {}
        }, 3000);
    }
    function stopPolling() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    }

    // ── Кнопка вставки из буфера ──────────────────────────────────────────────
    const pasteBtn = document.getElementById('pasteBtn');

    async function updatePasteBtn() {
        if (!navigator.clipboard?.readText) { pasteBtn.disabled = false; return; }
        try {
            const perm = await navigator.permissions.query({ name: 'clipboard-read' });
            if (perm.state === 'granted') {
                const text = await navigator.clipboard.readText();
                pasteBtn.disabled = !text.trim();
            } else {
                pasteBtn.disabled = false;
            }
        } catch {
            pasteBtn.disabled = false;
        }
    }

    updatePasteBtn();
    window.addEventListener('focus', updatePasteBtn);

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('urlInput').value = text;
            updatePasteBtn();
        } catch {
            alert(t.clipboardDenied);
            pasteBtn.disabled = false;
        }
    }

    // ── Общая функция удаления ссылки ─────────────────────────────────────────
    async function deleteCurrentLink() {
        if (!currentPin) return;
        try {
            await fetch(`/api/link/${currentPin}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId })
            });
        } catch {}
        currentPin = null;
        activeUrl = null;
        stopPolling();
        if (countdownInterval) clearInterval(countdownInterval);
        const timerEl = document.getElementById('timerDisplay');
        timerEl.textContent = t.timerExpired;
        timerEl.classList.add('expired');
        timerEl.style.cursor = 'default';
    }

    // ── Отправка ──────────────────────────────────────────────────────────────
    async function sendLink() {
        const url = document.getElementById('urlInput').value.trim();
        const errDiv = document.getElementById('sendError');
        errDiv.innerText = '';

        if (!url) return (errDiv.innerText = t.errorEmpty);

        // Если PIN активен и URL не менялся — просто продлеваем таймер
        const pinActive = currentPin && countdownEnd && countdownEnd - Date.now() > 0;
        if (pinActive && url === activeUrl) {
            const btn = document.getElementById('sendBtn');
            btn.innerText = t.sendBtnLoading;
            btn.disabled = true;
            try {
                const res = await fetch('/api/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: currentPin, sessionId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                startCountdown(data.expiresAt);
                document.getElementById('notificationArea').innerText = '';
                startPolling(currentPin);
            } catch (err) {
                errDiv.innerText = err.message;
            } finally {
                btn.innerText = t.sendBtn;
                btn.disabled = false;
            }
            return;
        }

        const btn = document.getElementById('sendBtn');
        btn.innerText = t.sendBtnLoading;
        btn.disabled = true;

        try {
            const res = await fetch('/api/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, sessionId, uiLang: lang, browserLang: navigator.language })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            currentPin = data.pin;
            activeUrl = url;
            document.getElementById('sendResult').style.display = 'block';
            document.getElementById('generatedPin').innerText = data.pin;
            document.getElementById('notificationArea').innerText = '';
            const hintEl = document.getElementById('desktopHint');
            hintEl.textContent = t.desktopHint;
            hintEl.classList.remove('visible');
            void hintEl.offsetWidth; // reflow для перезапуска анимации
            hintEl.classList.add('visible');
            startCountdown(data.expiresAt);
            startPolling(data.pin);

            // Виральная строка
            const host = '1qaz.su';
            document.getElementById('viralChipText').textContent = t.viralChip(host, data.pin);
            document.getElementById('viralLine').style.display = 'block';

            // QR
            const qrWrapper = document.getElementById('qrWrapper');
            const qrImg     = document.getElementById('qrImg');
            if (data.qr) {
                qrImg.src = data.qr;
                qrWrapper.style.display = 'flex';
            } else {
                qrWrapper.style.display = 'none';
            }
        } catch (err) {
            errDiv.innerText = err.message;
        } finally {
            btn.innerText = t.sendBtn;
            btn.disabled = false;
        }
    }

    function copyViralMessage() {
        if (!currentPin) return;
        const host = '1qaz.su';
        const msg  = t.viralMsg(host, currentPin);
        navigator.clipboard.writeText(msg).then(() => {
            const chip = document.getElementById('viralChip');
            chip.classList.add('copied');
            const orig = document.getElementById('viralChipText').textContent;
            document.getElementById('viralChipText').textContent = t.viralCopied;
            setTimeout(() => {
                chip.classList.remove('copied');
                document.getElementById('viralChipText').textContent = orig;
            }, 1500);
        }).catch(() => {});
    }

    function copyPin() {
        const pin = document.getElementById('generatedPin').innerText;
        navigator.clipboard.writeText(pin).then(() => {
            const el = document.getElementById('generatedPin');
            el.innerText = '✓';
            setTimeout(() => el.innerText = pin, 800);
        }).catch(() => alert(t.copyFailed));
    }

    // ── Таймер ────────────────────────────────────────────────────────────────
    function startCountdown(endTime) {
        countdownEnd = endTime;
        if (countdownInterval) clearInterval(countdownInterval);
        const timerEl = document.getElementById('timerDisplay');
        timerEl.classList.remove('expired');
        timerEl.style.cursor = 'pointer';
        timerEl.title = t.timerDeleteHint;
        updateTimerDisplay();
        countdownInterval = setInterval(updateTimerDisplay, 1000);
    }

    function updateTimerDisplay() {
        const timerEl = document.getElementById('timerDisplay');
        const remaining = countdownEnd - Date.now();
        if (remaining <= 0) {
            clearInterval(countdownInterval);
            timerEl.textContent = t.timerExpired;
            timerEl.classList.add('expired');
            stopPolling();
            return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent = t.timerRunning(mins, secs.toString().padStart(2, '0'));
    }

    async function deleteLink() {
        if (!currentPin || (countdownEnd && countdownEnd - Date.now() <= 0)) return;
        if (!confirm(t.deleteConfirm)) return;
        await deleteCurrentLink();
    }

    // ── Получение ─────────────────────────────────────────────────────────────
    const pinInput = document.getElementById('pinInput');
    const urlInput = document.getElementById('urlInput');

    document.addEventListener('keydown', (e) => {
        if (document.activeElement === urlInput) return;
        if (e.key >= '0' && e.key <= '9') typePin(e.key);
        if (e.key === 'Backspace') deleteLastPin();
    });

    function typePin(num) {
        if (pinInput.value.length < currentPinLength) {
            pinInput.value += num;
            if (pinInput.value.length === currentPinLength) submitPin();
        }
    }

    function deleteLastPin() {
        pinInput.value = pinInput.value.slice(0, -1);
        document.getElementById('receiveError').innerText = '';
    }

    function clearPin() {
        pinInput.value = '';
        document.getElementById('receiveError').innerText = '';
        document.getElementById('successArea').style.display = 'none';
    }

    async function submitPin() {
        const pin = pinInput.value;
        const errDiv = document.getElementById('receiveError');
        const successArea = document.getElementById('successArea');
        errDiv.innerText = '';
        successArea.style.display = 'none';

        try {
            const res = await fetch(`/api/link/${pin}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            receivedContent = data.url;
            const linkEl  = document.getElementById('receivedLink');
            const textEl  = document.getElementById('receivedText');
            const openBtn = document.getElementById('openBtn');
            const label   = document.getElementById('receivedLabel');

            if (isUrl(receivedContent)) {
                linkEl.textContent = receivedContent;
                linkEl.href = receivedContent;
                linkEl.style.display = '';
                textEl.style.display = 'none';
                openBtn.style.display = '';
                label.innerHTML = t.labelLink;
            } else {
                textEl.textContent = receivedContent;
                textEl.style.display = '';
                linkEl.style.display = 'none';
                openBtn.style.display = 'none';
                label.innerHTML = t.labelText;
            }

            const hint = document.getElementById('desktopHint');
            hint.textContent = '';
            hint.classList.remove('visible');
            successArea.style.display = 'block';
            successArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            pinInput.value = '';
        } catch (err) {
            errDiv.innerText = err.message;
            const hint = document.getElementById('desktopHint');
            hint.textContent = '';
            hint.classList.remove('visible');
        }
    }

    function openReceivedContent() {
        if (receivedContent) window.open(receivedContent, '_blank', 'noopener,noreferrer');
    }

    function copyReceivedContent() {
        if (receivedContent) navigator.clipboard.writeText(receivedContent).then(() => alert(t.copied));
    }
</script>
</body>
</html>
